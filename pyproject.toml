[project]
name = "flask-saml2"
dynamic = ["version"]
description = "SAML 2.0 IdP and SP for Flask and Python 3"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Heap", email = "tim.heap@tidetech.org" }]
requires-python = ">=3.10"
dependencies = [
    "attrs",
    "Flask",
    "signxml",
    "lxml",
    "pyopenssl",
    "defusedxml",
    "pytz",
    "iso8601",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]

[project.urls]
Homepage = "https://github.com/timheap/flask-saml2"

[dependency-groups]
test = [
    "beautifulsoup4",
    "html5lib",
    "flask-login",
    "pytest",
    "xmlunittest",
    "freezegun",
]
lint = [
    "flake8",
    "flake8-print",
    "isort",
]
docs = [
    "Sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "sphobjinv",
    "inotify; sys_platform == 'linux'",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "flask_saml2/version.py"
expression = "version_str"

[tool.hatch.build.targets.sdist]
include = ["flask_saml2", "tests", "README.rst", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["flask_saml2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
line_length = 80
multi_line_output = 4
